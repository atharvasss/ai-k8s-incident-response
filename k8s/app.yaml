apiVersion: v1
kind: Namespace
metadata:
  name: incident-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: incident-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo "$(date) INFO request processed successfully"
            sleep 5
          done
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: incident-demo
spec:
  selector:
    app: demo-app
  ports:
  - port: 8080
    targetPort: 8080
