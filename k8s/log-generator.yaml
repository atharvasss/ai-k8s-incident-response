apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: incident-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
      - name: logger
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo "$(date) INFO request processed successfully"
            echo "$(date) INFO database connection healthy"
            sleep 3
          done
